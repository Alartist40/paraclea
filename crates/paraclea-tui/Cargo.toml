[package]
name = "paraclea-tui"
version = "0.1.0"
edition = "2021"
authors = ["Xander <https://github.com/Alartist40>"]
description = "Paraclea Terminal User Interface — Ratatui & Crossterm Desktop TUI"
license = "MIT"

[dependencies]
paraclea-core = { path = "../paraclea-core" }
ratatui = { version = "0.29", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

