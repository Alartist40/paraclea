[package]
name = "paraclea-cli"
version = "0.1.0"
edition = "2021"
authors = ["Xander <https://github.com/Alartist40>"]
description = "Paraclea CLI — Terminal Companion & Scripture Reader"
license = "MIT"

[[bin]]
name = "paraclea"
path = "src/main.rs"

[dependencies]
paraclea-core = { path = "../paraclea-core" }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
