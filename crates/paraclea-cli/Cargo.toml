[package]
name = "paraclea-cli"
version = "0.1.0"
edition = "2021"
authors = ["Xander <https://github.com/Alartist40>"]
description = "Paraclea CLI — Terminal Companion & Scripture Reader"
license = "MIT"

[[bin]]
name = "paraclea"
path = "src/main.rs"

[dependencies]
paraclea-core = { path = "../paraclea-core" }
paraclea-tui = { path = "../paraclea-tui" }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"
tokio = { version = "1.38", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
rand = "0.8"

