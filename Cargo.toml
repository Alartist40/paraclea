[package]
name = "paraclea"
version = "0.1.0"
edition = "2021"
authors = ["Xander <https://github.com/Alartist40>"]
description = "Paraclea — Cute AI Companion & Self-Developing Assistant Engine in Rust"
license = "MIT"

[dependencies]
# CLI & Terminal UI (Gold & Purple styling)
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"

# Async Runtime
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"

# Audio Playback
rodio = "0.19"
cpal = "0.15"

# HTTP Client for Ollama & Pocket TTS
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# Logging & Error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
