[package]
name = "ai-avatar-vision"
version = "0.1.0"
edition = "2021"

[dependencies]
opencv = { version = "0.98.2", features = ["dnn", "imgproc", "videoio", "objdetect", "imgcodecs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
